# fly.toml app configuration file for SeedCore Scheduler
#
# See https://fly.io/docs/reference/configuration/ for information

app = "seedcore-scheduler"
primary_region = "nrt" # 도쿄 리전 (한국과 가까운 무료 권장 리전)

[build]
  dockerfile = "Dockerfile.fly"

[env]
  DATABASE_URL = "file:/var/seedcore-scheduler/data/app.db"
  BACKUP_DIR = "/var/seedcore-scheduler/backup/daily"
  WEB_ORIGIN = "https://seedcore-scheduler.fly.dev"
  # 접속자 IP 를 X-Forwarded-For 의 몇 번째에서 읽을지 정한다
  # (apps/api/src/common/trust-proxy.ts). 이 배포는 중계가 둘이다 —
  # 브라우저 → Fly 엣지 → 컨테이너 안의 nginx(deploy/nginx.fly.conf) → api.
  # 이 값이 없으면 접속자 전원이 nginx 의 127.0.0.1 하나로 묶여 로그인 제한 통을
  # 함께 쓰고, 감사로그의 ip 도 전부 127.0.0.1 로 남는다.
  TRUSTED_PROXY_HOPS = "2"
  # 컨테이너의 로컬 시각. 지정하지 않으면 UTC 다. BackupService 의 cron 은 Asia/Seoul 기준으로
  # 04:00 에 발화하는데(backup.service.ts 의 TIMEZONE) 백업 폴더 이름을 만드는 formatDay() 는
  # 로컬 시각을 쓰므로, TZ 가 없으면 04:00 KST 백업이 전날 날짜 폴더에 들어간다. 급하게 사본을
  # 찾아야 하는 자리에서 하루를 헷갈리게 하므로 둘의 기준을 맞춘다. 로그 타임스탬프
  # (common/daily-logger.service.ts) 도 함께 한국 시각이 된다.
  # alpine 에 tzdata 가 없어도 Node 가 번들한 ICU 로 해석된다 — node:22-alpine 에서 실측했다.
  TZ = "Asia/Seoul"
  # 세션 시크릿 등 민감한 환경변수는 fly secrets set 명령어로 주입하는 것을 권장합니다.


[[mounts]]
  source = "seedcore_data"
  destination = "/var/seedcore-scheduler"
  initial_size = "1gb" # Fly.io 무료 티어 범위 내 (최대 3GB 무료)

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]
